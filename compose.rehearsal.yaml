# Extend compose.production.yaml; isolated loopback-only production-settings rehearsal.
services:
  certificates:
    image: ${PPI_POSTGRES_IMAGE:?Pinned PostgreSQL image required}
    user: '0:0'
    entrypoint: [sh, /bootstrap-tls.sh]
    volumes: ["rehearsal_tls:/certs", "./deploy/bootstrap-tls.sh:/bootstrap-tls.sh:ro"]
    restart: 'no'
  db:
    image: ${PPI_POSTGRES_IMAGE:?Pinned PostgreSQL image required}
    env_file: ["${PPI_DB_ENV_FILE:?Protected new rehearsal DB configuration required}"]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/certs/db.crt, -c, ssl_key_file=/certs/db.key, -c, log_min_error_statement=panic]
    volumes: ["rehearsal_database:/var/lib/postgresql/data", "rehearsal_tls:/certs:ro"]
    depends_on:
      certificates: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 512m
  scanner:
    image: ${PPI_SCANNER_IMAGE:?Pinned official ClamAV image required}
    volumes: ["rehearsal_signatures:/var/lib/clamav"]
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: 'true'
    healthcheck:
      start_period: 180s
      interval: 15s
      timeout: 5s
      retries: 30
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.rehearsal
    volumes: ["rehearsal_tls:/certs:ro"]
    depends_on:
      db: {condition: service_healthy}
      scanner: {condition: service_healthy}
  migration:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.rehearsal
    volumes: ["rehearsal_tls:/certs:ro", "${PPI_REHEARSAL_STATE_DIR:?Protected rehearsal state required}:/release-state:ro"]
  frontend:
    environment:
      NODE_EXTRA_CA_CERTS: /certs/ca.crt
    volumes: ["rehearsal_tls:/certs:ro"]
  edge:
    image: ${PPI_INGRESS_IMAGE:?Pinned ingress image required}
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro", "rehearsal_tls:/certs:ro"]
    ports: ['127.0.0.1:${PPI_HTTPS_PORT:-8443}:8443']
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --cacert, /certs/ca.crt, 'https://localhost:8443/api/v1/health/ready/']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
volumes:
  rehearsal_tls:
  rehearsal_database:
  rehearsal_signatures:
