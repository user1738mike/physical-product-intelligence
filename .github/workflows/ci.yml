name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: ppi
          POSTGRES_USER: ppi
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppi -d ppi"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: ppi
      POSTGRES_USER: ppi
      POSTGRES_PASSWORD: ci-disposable-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff format --check . ../scripts
      - run: ruff check . ../scripts
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test accounts organizations operations products
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s scripts -p test_setup_env.py
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose exec -T backend python manage.py migrate --noinput
      - run: docker compose exec -T backend python manage.py migrate --check
      - run: docker compose exec -T backend python manage.py test accounts organizations operations products --settings=config.settings.test
      - run: python scripts/phase2_smoke.py --allow-create-test-data
      - run: python scripts/phase3_smoke.py --allow-create-test-data
      - run: python scripts/smoke.py
      - run: docker build --target production -t ppi-frontend-check ./frontend
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Shutdown
        if: always()
        run: docker compose down --volumes
