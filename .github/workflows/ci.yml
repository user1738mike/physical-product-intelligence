name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: ppi
          POSTGRES_USER: ppi
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppi -d ppi"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      AI_EXTRACTION_ENABLED: "false"
      POSTGRES_DB: ppi
      POSTGRES_USER: ppi
      POSTGRES_PASSWORD: ci-disposable-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -r requirements-ai.lock
      - run: pip check
      - run: ruff format --config pyproject.toml --check . ../scripts
      - run: ruff check --config pyproject.toml . ../scripts
      - run: python manage.py check
      - run: python ../scripts/check_production_config.py
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python manage.py test accounts organizations operations products ingestion compatibility commercial billing integrations
      - run: python manage.py evaluate_extraction
      - run: python manage.py check_ai_provider
      - run: python -m unittest discover -s ../scripts -p 'test_*.py'
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  compose-smoke:
    runs-on: ubuntu-24.04
    env:
      AI_EXTRACTION_ENABLED: "false"
      COMPOSE_FILE: compose.yaml:compose.runtime-check.yaml
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
      - name: Match non-root bind-mount permissions to runner
        run: |
          echo "PPI_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PPI_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose up --build -d db backend
      - run: docker compose exec -T backend python manage.py migrate --noinput
      - run: docker compose exec -T backend python manage.py migrate --check
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose exec -T backend python manage.py test accounts organizations operations products ingestion compatibility commercial billing integrations --settings=config.settings.test
      - run: python scripts/phase2_smoke.py --allow-create-test-data
      - run: python scripts/phase3_smoke.py --allow-create-test-data
      - run: python scripts/smoke.py
      - run: docker build --target production -t ppi-frontend-check ./frontend
      - run: docker run --rm --network none --entrypoint node ppi-frontend-check -e "const fs=require('fs'); if(process.getuid()===0 || fs.existsSync('/app/.env') || fs.existsSync('/app/media')) process.exit(1)"
      - name: Scan production frontend image
        run: |
          docker save -o /tmp/frontend.tar ppi-frontend-check
          docker image inspect ppi-frontend-check --format '{{.Id}}' > /tmp/frontend-image-id.txt
          docker run --rm -e GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h -v /tmp:/scan:ro anchore/grype:v0.120.1 docker-archive:/scan/frontend.tar --output json --fail-on high > /tmp/frontend-vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-image-security
          path: |
            /tmp/frontend-vulnerabilities.json
            /tmp/frontend-image-id.txt
          if-no-files-found: warn
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Shutdown
        if: always()
        run: docker compose down
  backend-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ai: ["false", "true"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg INSTALL_AI=${{ matrix.ai }} -t ppi-backend-check ./backend
      - run: docker run --rm --network none --entrypoint python ppi-backend-check -m pip check
      - run: docker run --rm --network none --entrypoint python ppi-backend-check -c "import os,pathlib; assert os.getuid()!=0; assert not list(pathlib.Path('/app').rglob('.env*')); assert not pathlib.Path('/app/media').exists()"
      - name: Scan runtime image (high/critical findings block release)
        run: |
          docker save -o /tmp/backend.tar ppi-backend-check
          docker image inspect ppi-backend-check --format '{{.Id}}' > /tmp/backend-image-id.txt
          docker run --rm -e GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h -v /tmp:/scan:ro anchore/grype:v0.120.1 docker-archive:/scan/backend.tar --output json --fail-on high > /tmp/backend-vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-image-security-sdk-${{ matrix.ai }}
          path: |
            /tmp/backend-vulnerabilities.json
            /tmp/backend-image-id.txt
          if-no-files-found: warn
  infrastructure-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          - name: ingress
            image: nginx@sha256:d5792f71a9496b833bc08ea834a758c46e2b6a6306c10f4be926f38a656cdc1c
          - name: scanner
            image: clamav/clamav@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    steps:
      - run: docker pull '${{ matrix.image }}'
      - name: Scan exact infrastructure artifact
        run: |
          docker save -o /tmp/image.tar '${{ matrix.image }}'
          docker run --rm -e GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h -v /tmp:/scan:ro anchore/grype:v0.120.1 docker-archive:/scan/image.tar --output json --fail-on high > /tmp/vulnerabilities.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-security-${{ matrix.name }}
          path: /tmp/vulnerabilities.json
          if-no-files-found: warn
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Build actual production applications and isolated browser
        run: |
          docker build -t physical-product-intelligence-backend backend
          docker build --target production -t physical-product-intelligence-frontend frontend
          docker build -t ppi-phase8b-browser browser-tests
          docker pull postgres:17.11-bookworm
          docker pull nginx:1.30.4
          docker pull clamav/clamav:stable
      - name: Create isolated HTTPS rehearsal
        run: |
          python scripts/release.py prepare --directory artifacts/browser-ci --https-port 18443 --processors
          python scripts/release.py start --directory artifacts/browser-ci
      - name: Create synthetic login context using real session and business APIs
        env:
          PPI_SMOKE_ORIGIN: https://127.0.0.1:18443
          PPI_SMOKE_CA: artifacts/browser-ci/ca.crt
          PPI_SMOKE_FIXTURES: recorded
          PPI_REHEARSAL_CONTEXT: artifacts/browser-ci/journey.json
        run: |
          python scripts/phase2_smoke.py --allow-create-test-data
          python scripts/phase3_smoke.py --allow-create-test-data
      - name: Real browser with private test-only CA trust and sandbox
        run: python scripts/browser_acceptance.py --directory artifacts/browser-ci --output artifacts/browser-results --commercial-fixtures --billing-fixtures --integration-fixtures --recovery-fixtures
      - name: Signed local integration and revocation demonstration
        run: python scripts/integration_demo.py --directory artifacts/browser-ci --output artifacts/integration-demo-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-acceptance-sanitized
          path: |
            artifacts/browser-results/execution.json
            artifacts/browser-results/acceptance.json
            artifacts/browser-results/browser.json
            artifacts/browser-results/browser.log
            artifacts/browser-results/compatible-history.png
            artifacts/browser-results/billing-settled.png
            artifacts/browser-results/billing-processing.json
            artifacts/browser-results/integrations-management.png
            artifacts/integration-demo-ci/receipt.json
          if-no-files-found: warn
