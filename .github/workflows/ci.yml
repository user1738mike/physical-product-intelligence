name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: ppi
          POSTGRES_USER: ppi
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ppi -d ppi"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      AI_EXTRACTION_ENABLED: "false"
      POSTGRES_DB: ppi
      POSTGRES_USER: ppi
      POSTGRES_PASSWORD: ci-disposable-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install -r requirements-ai.lock
      - run: pip check
      - run: ruff format --config pyproject.toml --check . ../scripts
      - run: ruff check --config pyproject.toml . ../scripts
      - run: python manage.py check
      - run: python ../scripts/check_production_config.py
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py migrate --check
      - run: python manage.py test accounts organizations operations products ingestion compatibility
      - run: python manage.py evaluate_extraction
      - run: python manage.py check_ai_provider
      - run: python -m unittest discover -s ../scripts -p 'test_*.py'
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      AI_EXTRACTION_ENABLED: "false"
      COMPOSE_FILE: compose.yaml:compose.runtime-check.yaml
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
      - name: Match non-root bind-mount permissions to runner
        run: |
          echo "PPI_CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "PPI_CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose up --build -d db backend
      - run: docker compose exec -T backend python manage.py migrate --noinput
      - run: docker compose exec -T backend python manage.py migrate --check
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose exec -T backend python manage.py test accounts organizations operations products ingestion compatibility --settings=config.settings.test
      - run: python scripts/phase2_smoke.py --allow-create-test-data
      - run: python scripts/phase3_smoke.py --allow-create-test-data
      - run: python scripts/smoke.py
      - run: docker build --target production -t ppi-frontend-check ./frontend
      - run: docker run --rm --network none --entrypoint node ppi-frontend-check -e "const fs=require('fs'); if(process.getuid()===0 || fs.existsSync('/app/.env') || fs.existsSync('/app/media')) process.exit(1)"
      - name: Scan production frontend image
        run: |
          docker save -o /tmp/frontend.tar ppi-frontend-check
          docker run --rm -v /tmp:/scan:ro anchore/grype:v0.120.1 docker-archive:/scan/frontend.tar --fail-on high
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Shutdown
        if: always()
        run: docker compose down
  backend-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        ai: ["false", "true"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg INSTALL_AI=${{ matrix.ai }} -t ppi-backend-check ./backend
      - run: docker run --rm --network none --entrypoint python ppi-backend-check -m pip check
      - run: docker run --rm --network none --entrypoint python ppi-backend-check -c "import os,pathlib; assert os.getuid()!=0; assert not list(pathlib.Path('/app').rglob('.env*')); assert not pathlib.Path('/app/media').exists()"
      - name: Scan runtime image (high/critical findings block release)
        run: |
          docker save -o /tmp/backend.tar ppi-backend-check
          docker run --rm -v /tmp:/scan:ro anchore/grype:v0.120.1 docker-archive:/scan/backend.tar --fail-on high
