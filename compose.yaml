name: physical-product-intelligence
services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    user: "${PPI_CONTAINER_UID:-10001}:${PPI_CONTAINER_GID:-10001}"
    build:
      context: ./backend
      args:
        INSTALL_AI: ${INSTALL_AI_SDK:-false}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      AI_EXTRACTION_ENABLED: ${AI_EXTRACTION_ENABLED:-false}
      AI_EXTRACTION_PROVIDER: ${AI_EXTRACTION_PROVIDER:-openai}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["127.0.0.1:${PPI_BACKEND_PORT:-8000}:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    build:
      context: ./frontend
      target: development
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BACKEND_ORIGIN: http://backend:8000
    ports: ["127.0.0.1:${PPI_FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
volumes:
  postgres_data:
