# Extend the production recipe after operator provisioning and migrations.
# Uses the protected owner connection because append-only delivery attempts and
# fenced commercial recovery are deliberately unavailable to the HTTP DB role.
services:
  processors:
    image: ${PPI_BACKEND_IMAGE:?Set a reviewed immutable backend image reference}
    env_file: ["${PPI_MIGRATION_ENV_FILE:?Set the separately protected processor owner configuration file}"]
    command: [python, manage.py, run_processors]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      INGESTION_STORAGE_ROOT: /var/lib/ppi/private
      INGESTION_SCANNER: ingestion.scanning.clamd_scan
      AI_EXTRACTION_ENABLED: 'false'
      PPI_PROCESSOR_ACTOR: ${PPI_PROCESSOR_ACTOR:?Set a provisioned active operator username}
    init: true
    restart: unless-stopped
    stop_grace_period: 240s
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import time; from pathlib import Path; p=Path('/tmp/ppi-processors-heartbeat'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<240 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 2
      start_period: 60s
